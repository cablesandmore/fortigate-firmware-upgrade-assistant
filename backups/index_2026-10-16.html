<!DOCTYPE html>
<html>
<head>
    <title>FortiGate Firmware Upgrade Assistant</title>
</head>
<body>

<h1>FortiGate Firmware Upgrade Assistant</h1>

<form method="POST">

    <label>Modelo:</label>

    <select name="modelo">
        <option value="FG-60F">FG-60F</option>
        <option value="FG-100F">FG-100F</option>
    </select>

    <br><br>

    <label>Versión actual:</label>

    <input type="text" name="version">

    <br><br>

    <button type="submit">Buscar Ruta</button>

</form>

{% if resultado %}
<h2>Ruta Recomendada</h2>

<ul>
{% for paso in resultado %}
<li>{{ paso }}</li>
{% endfor %}
</ul>
{% endif %}

</body>
</html>
